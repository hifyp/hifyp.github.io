<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Hifyp</title>
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --bg-header: #0f172a;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="dark"] {
            --bg-body: #090d16; --bg-card: #131b2e; --bg-header: #060910;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --border-color: #1e293b;
            --accent: #60a5fa; --accent-hover: #3b82f6; --danger: #f87171; --warning: #fbbf24;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        header { background: var(--bg-header); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.3rem; }
        .container { max-width: 880px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--bg-card); padding: 28px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="date"], input[type="url"], input[type="file"], select, textarea { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); font-family: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 0.9rem; color: var(--text-muted); }
        .checkbox-row input { width: auto; margin: 0; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn:hover { background: var(--accent-hover); }
        .btn-warning { background: var(--warning); color: #0f172a; padding: 6px 12px; font-size: 0.8rem; }
        .btn-danger { background: var(--danger); padding: 6px 12px; font-size: 0.8rem; }
        .btn-secondary { background: #64748b; color: #fff; margin-left: 8px; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); gap: 12px; }
        .item-row:last-child { border-bottom: none; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .status-msg { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; font-weight: 500; }
        .status-ok { background: #dcfce7; color: #166534; display: block; }
        .status-err { background: #fee2e2; color: #991b1b; display: block; }
        .preview-box { width: 130px; height: 130px; border-radius: 12px; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 16px; background: var(--bg-body); }
        .preview-box.ratio-3-4 { width: 120px; height: 160px; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .preview-box.logo-preview img { object-fit: contain; padding: 8px; }

        /* Toolbar & Editor Teks Kaya (Bold, Italic, Underline, Enter) */
        .editor-toolbar { display: flex; gap: 6px; flex-wrap: wrap; background: var(--bg-body); border: 1px solid var(--border-color); border-bottom: none; padding: 8px 10px; border-radius: 6px 6px 0 0; }
        .tool-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
        .rich-editor { min-height: 150px; padding: 12px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: 0 0 6px 6px; background: var(--bg-body); color: var(--text-main); line-height: 1.65; outline: none; text-align: justify; }
        .rich-editor:focus { border-color: var(--accent); }
        .helper-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>🔐 Admin Panel - Hifyp</h1>
        <div>
            <a href="index.html" class="btn btn-outline" style="text-decoration:none; margin-right:8px;">Lihat Web</a>
            <button id="logoutBtn" class="btn btn-outline" style="display:none;" onclick="logout()">Keluar</button>
        </div>
    </header>

    <div class="container">
        <div id="statusBox" class="status-msg"></div>

        <!-- FORM LOGIN -->
        <div id="loginSection" class="card">
            <h2 style="margin-top:0;">Masuk Pengelola Konten</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Gunakan GitHub Personal Access Token (PAT) dengan izin <b>repo</b> atau <b>Contents: Read and write</b>.</p>
            
            <label>Username GitHub</label>
            <input type="text" id="ghOwner" value="hifyp">

            <label>Nama Repository</label>
            <input type="text" id="ghRepo" value="hifyp.github.io">

            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxx atau github_pat_xxxx">

            <div class="checkbox-row">
                <input type="checkbox" id="rememberToken" checked>
                <label for="rememberToken" style="margin:0; font-weight:400; cursor:pointer;">Ingat login di perangkat ini (tidak perlu input token lagi)</label>
            </div>

            <button class="btn" onclick="login()">Masuk Dashboard</button>
        </div>

        <!-- DASHBOARD ADMIN -->
        <div id="dashboardSection" style="display:none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('profil', this)">Profil, Foto &amp; Footer</button>
                <button class="tab-btn" onclick="switchTab('filosofi', this)">Filosofi Logo</button>
                <button class="tab-btn" onclick="switchTab('seduhRasa', this)">Seduh Rasa</button>
                <button class="tab-btn" onclick="switchTab('sambungCerita', this)">Sambung Cerita</button>
                <button class="tab-btn" onclick="switchTab('ukirKarya', this)">Ukir Karya</button>
                <button class="tab-btn" onclick="switchTab('pojokUnduh', this)">Pojok Unduh</button>
                <button class="tab-btn" onclick="switchTab('kontak', this)">Kontak &amp; Medsos</button>
            </div>

            <div class="card">
                <h3 id="formTitle" style="margin-top:0;">Pengaturan Profil, Foto &amp; Footer</h3>
                <form id="contentForm" onsubmit="saveItem(event)">
                    <div id="dynamicFields"></div>
                    <button type="submit" class="btn" id="submitBtn">Simpan &amp; Publikasikan ke GitHub</button>
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Batal Edit</button>
                </form>
            </div>

            <div class="card" id="listCard" style="display:none;">
                <h3 style="margin-top:0;">Daftar Konten Aktif</h3>
                <div id="existingList">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        let currentTab = 'profil';
        let editingIndex = null;
        let siteData = { profil: {}, filosofi: {}, seduhRasa: [], sambungCerita: [], ukirKarya: [], pojokUnduh: [], kontak: [] };
        let fileSha = '';
        let selectedImageBase64 = null;

        const PLATFORM_PRESETS = {
            whatsapp: { ikon: '💬', nama: 'WhatsApp', label: 'Nomor WhatsApp (Contoh: 08896565758 atau 628896565758)', placeholder: '08896565758', hint: 'Otomatis dibuatkan tautan https://wa.me/62...' },
            email: { ikon: '✉️', nama: 'Email', label: 'Alamat Email', placeholder: 'nama@email.com', hint: 'Otomatis diawali mailto: agar langsung membuka aplikasi email' },
            instagram: { ikon: '📸', nama: 'Instagram', label: 'Username atau URL Instagram', placeholder: 'hifyp (tanpa @)', hint: 'Cukup masukkan username, otomatis menjadi https://instagram.com/...' },
            github: { ikon: '💻', nama: 'GitHub', label: 'Username atau URL GitHub', placeholder: 'hifyp', hint: 'Otomatis menjadi https://github.com/...' },
            linkedin: { ikon: '🔗', nama: 'LinkedIn', label: 'Username atau URL Profil LinkedIn', placeholder: 'in/username atau URL lengkap', hint: 'Otomatis menjadi https://linkedin.com/...' },
            tiktok: { ikon: '🎵', nama: 'TikTok', label: 'Username TikTok', placeholder: 'hifyp (tanpa @)', hint: 'Otomatis menjadi https://tiktok.com/@...' },
            youtube: { ikon: '▶️', nama: 'YouTube', label: 'Handle (@channel) atau URL YouTube', placeholder: '@hifyp', hint: 'Otomatis menjadi https://youtube.com/...' },
            x: { ikon: '𝕏', nama: 'X (Twitter)', label: 'Username X / Twitter', placeholder: 'hifyp (tanpa @)', hint: 'Otomatis menjadi https://x.com/...' },
            telegram: { ikon: '✈️', nama: 'Telegram', label: 'Username Telegram', placeholder: 'hifyp (tanpa @)', hint: 'Otomatis menjadi https://t.me/...' },
            custom: { ikon: '🌐', nama: 'Website', label: 'Tautan URL Lengkap', placeholder: 'https://...', hint: 'Pastikan diawali https://' }
        };

        window.onload = () => {
            const savedToken = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');
            if (savedToken) {
                document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner') || 'hifyp';
                document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo') || 'hifyp.github.io';
                document.getElementById('ghToken').value = savedToken;
                login(true);
            }
        };

        function showStatus(msg, isError = false) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status-msg ' + (isError ? 'status-err' : 'status-ok');
            if (!isError) setTimeout(() => { box.style.display = 'none'; }, 6000);
        }

        function getAuthHeaders(token) {
            return {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
        }

        async function login(isAuto = false) {
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const remember = document.getElementById('rememberToken').checked;

            if (!owner || !repo || !token) return showStatus('Semua kolom wajib diisi!', true);

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json?t=${Date.now()}`, {
                    headers: getAuthHeaders(token),
                    cache: 'no-store'
                });

                if (!res.ok) {
                    const errJson = await res.json().catch(() => ({}));
                    throw new Error(`Gagal akses GitHub (${res.status}): ${errJson.message || 'Token tidak valid atau data.json belum ada.'}`);
                }

                const json = await res.json();
                fileSha = json.sha;
                const cleanBase64 = json.content.replace(/\n/g, '');
                const decoded = decodeURIComponent(escape(atob(cleanBase64)));
                siteData = JSON.parse(decoded);
                if (!siteData.kontak) siteData.kontak = [];
                if (!siteData.profil) siteData.profil = {};
                if (!siteData.filosofi) siteData.filosofi = {};

                const storage = remember ? localStorage : sessionStorage;
                storage.setItem('gh_owner', owner);
                storage.setItem('gh_repo', repo);
                storage.setItem('gh_token', token);

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                if (!isAuto) showStatus('Berhasil terhubung ke repository GitHub!');
                
                renderForm();
                renderList();
            } catch (err) {
                if (isAuto) {
                    localStorage.removeItem('gh_token');
                    sessionStorage.removeItem('gh_token');
                }
                showStatus(err.message, true);
            }
        }

        function logout() {
            localStorage.removeItem('gh_owner');
            localStorage.removeItem('gh_repo');
            localStorage.removeItem('gh_token');
            sessionStorage.clear();
            location.reload();
        }

        function switchTab(tabName, btnEl) {
            currentTab = tabName;
            editingIndex = null;
            selectedImageBase64 = null;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderForm();
            renderList();
        }

        function formatDoc(cmd, editorId) {
            const editor = document.getElementById(editorId);
            if (editor) {
                editor.focus();
                document.execCommand(cmd, false, null);
            }
        }

        function updatePreviewRatio(ratioVal, boxId) {
            const box = document.getElementById(boxId);
            if (!box) return;
            if (ratioVal === '3:4') {
                box.classList.add('ratio-3-4');
            } else {
                box.classList.remove('ratio-3-4');
            }
        }

        function handleImageSelect(input, previewId, requirePng = false) {
            const file = input.files[0];
            if (!file) return;
            if (requirePng && file.type !== 'image/png') {
                showStatus('Harap pilih file gambar dengan format .PNG!', true);
                input.value = '';
                return;
            }
            if (!file.type.startsWith('image/')) {
                showStatus('Harap pilih file gambar yang valid!', true);
                input.value = '';
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showStatus('Ukuran gambar maksimal 2 MB agar halaman cepat dimuat.', true);
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const preview = document.getElementById(previewId);
                preview.src = dataUrl;
                preview.style.display = 'block';
                selectedImageBase64 = dataUrl.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        function onPlatformChange() {
            const type = document.getElementById('f_platform').value;
            const preset = PLATFORM_PRESETS[type] || PLATFORM_PRESETS.custom;
            document.getElementById('f_ikon').value = preset.ikon;
            document.getElementById('f_nama').value = preset.nama;
            document.getElementById('lbl_target').textContent = preset.label;
            document.getElementById('f_target').placeholder = preset.placeholder;
            document.getElementById('hint_target').textContent = preset.hint;
        }

        function buildContactUrl(platform, rawInput) {
            const val = rawInput.trim();
            if (platform === 'whatsapp') {
                if (val.startsWith('http://') || val.startsWith('https://')) return val;
                let digits = val.replace(/\D/g, '');
                if (digits.startsWith('0')) digits = '62' + digits.slice(1);
                return `https://wa.me/${digits}`;
            }
            if (platform === 'email') {
                return val.startsWith('mailto:') ? val : `mailto:${val}`;
            }
            if (val.startsWith('http://') || val.startsWith('https://')) return val;
            const clean = val.replace(/^@/, '');
            if (platform === 'instagram') return `https://instagram.com/${clean}`;
            if (platform === 'github') return `https://github.com/${clean}`;
            if (platform === 'linkedin') return val.startsWith('in/') ? `https://linkedin.com/${val}` : `https://linkedin.com/in/${clean}`;
            if (platform === 'tiktok') return `https://tiktok.com/@${clean}`;
            if (platform === 'youtube') return val.startsWith('@') ? `https://youtube.com/${val}` : `https://youtube.com/@${clean}`;
            if (platform === 'x') return `https://x.com/${clean}`;
            if (platform === 'telegram') return `https://t.me/${clean}`;
            return `https://${val}`;
        }

        function detectPlatformFromLink(link) {
            if (!link) return { platform: 'custom', target: '' };
            if (link.startsWith('mailto:')) return { platform: 'email', target: link.replace('mailto:', '') };
            if (link.includes('wa.me/')) return { platform: 'whatsapp', target: link.split('wa.me/')[1].split('?')[0] };
            if (link.includes('instagram.com/')) return { platform: 'instagram', target: link.split('instagram.com/')[1].replace(/\/$/, '') };
            if (link.includes('github.com/')) return { platform: 'github', target: link.split('github.com/')[1].replace(/\/$/, '') };
            if (link.includes('linkedin.com/')) return { platform: 'linkedin', target: link.split('linkedin.com/')[1].replace(/\/$/, '') };
            if (link.includes('tiktok.com/')) return { platform: 'tiktok', target: link.split('tiktok.com/')[1].replace(/^@/, '').replace(/\/$/, '') };
            if (link.includes('youtube.com/')) return { platform: 'youtube', target: link.split('youtube.com/')[1].replace(/\/$/, '') };
            if (link.includes('x.com/') || link.includes('twitter.com/')) return { platform: 'x', target: link.split('.com/')[1].replace(/\/$/, '') };
            if (link.includes('t.me/')) return { platform: 'telegram', target: link.split('t.me/')[1].replace(/\/$/, '') };
            return { platform: 'custom', target: link };
        }

        function renderForm() {
            const container = document.getElementById('dynamicFields');
            const listCard = document.getElementById('listCard');
            const formTitle = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');
            const today = new Date().toISOString().split('T')[0];

            // TAB 1: PROFIL, FOTO & FOOTER
            if (currentTab === 'profil') {
                formTitle.textContent = 'Pengaturan Foto Profil (.PNG), Tentang Saya & Footer';
                listCard.style.display = 'none';
                cancelBtn.style.display = 'none';
                submitBtn.textContent = 'Simpan & Publikasikan ke GitHub';
                const defaultAbout = siteData.profil.tentang || 'Sebagai Penata Kelola Sistem dan Teknologi Informasi lulusan S1 Sistem Informasi di Dinas Pendidikan Provinsi DKI Jakarta, saya menjembatani tata kelola organisasi dengan solusi teknologi praktis. Berlandaskan semangat "Berkembang dengan Ilmu, Berdampak melalui Karya" serta "Bergerak dalam senyap, berdampak dalam nyata", saya membangun alur kerja digital yang ringan, efisien, dan berdampak.';
                const defaultFooter = siteData.profil.footer || '© 2026. hifyp by GitHub.';
                const currentRatio = siteData.profil.fotoRatio || '1:1';
                const v = siteData.profil.fotoVersion || Date.now();

                container.innerHTML = `
                    <label>Pratinjau Foto Saat Ini</label>
                    <div class="preview-box ${currentRatio === '3:4' ? 'ratio-3-4' : ''}" id="adminPreviewBox">
                        <img id="imgPreview" src="profil.png?v=${v}" onerror="this.style.display='none'" alt="Pratinjau">
                    </div>
                    <label>Rasio Bingkai Foto Profil</label>
                    <select id="f_fotoRatio" onchange="updatePreviewRatio(this.value, 'adminPreviewBox')">
                        <option value="1:1" ${currentRatio === '1:1' ? 'selected' : ''}>1:1 (Persegi)</option>
                        <option value="3:4" ${currentRatio === '3:4' ? 'selected' : ''}>3:4 (Potret / Vertikal)</option>
                    </select>
                    <label>Unggah Foto Baru (Wajib Format .PNG)</label>
                    <input type="file" id="f_foto" accept="image/png" onchange="handleImageSelect(this, 'imgPreview', true)">
                    
                    <label>Teks Bagian "Tentang Saya" (Mendukung Bold, Miring, Underline &amp; Enter)</label>
                    <div class="editor-toolbar">
                        <button type="button" class="tool-btn" onclick="formatDoc('bold', 'f_tentang_editor')" title="Tebal"><b>B</b> Bold</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('italic', 'f_tentang_editor')" title="Miring"><i>I</i> Miring</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('underline', 'f_tentang_editor')" title="Garis Bawah"><u>U</u> Underline</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('insertParagraph', 'f_tentang_editor')" title="Baris Baru">↵ Enter / Paragraf</button>
                    </div>
                    <div id="f_tentang_editor" class="rich-editor" contenteditable="true">${defaultAbout}</div>

                    <label>Teks Footer Kiri (Bagian Bawah Halaman)</label>
                    <input type="text" id="f_footer" required value="${defaultFooter}">
                `;
                return;
            }

            // TAB 2: FILOSOFI NAMA & LOGO HIFYP
            if (currentTab === 'filosofi') {
                formTitle.textContent = 'Pengaturan Frame Filosofi Nama & Logo Hifyp';
                listCard.style.display = 'none';
                cancelBtn.style.display = 'none';
                submitBtn.textContent = 'Simpan & Publikasikan ke GitHub';
                const defaultTitle = siteData.filosofi.judul || 'Filosofi Nama & Logo Hifyp';
                const defaultTeks = siteData.filosofi.teks || '<b>Hifyp</b> lahir dari sapaan hangat <i>"Hi, FYP"</i> yang memaknai setiap ruang digital sebagai titik temu gagasan, karya, dan kebermanfaatan nyata. Identitas ini merepresentasikan semangat <u>bergerak dalam senyap, berdampak dalam nyata</u>—sederhana dalam tampilan, namun terstruktur dan bermakna dalam setiap detailnya.';
                const currentRatio = siteData.filosofi.fotoRatio || '1:1';
                const v = siteData.filosofi.fotoVersion || Date.now();

                container.innerHTML = `
                    <label>Pratinjau Gambar / Logo Filosofi</label>
                    <div class="preview-box logo-preview ${currentRatio === '3:4' ? 'ratio-3-4' : ''}" id="filosofiPreviewBox">
                        <img id="filosofiImgPreview" src="logo-filosofi.png?v=${v}" onerror="this.style.display='none'" alt="Pratinjau Logo">
                    </div>
                    <label>Rasio Bingkai Gambar / Logo</label>
                    <select id="f_filosofiRatio" onchange="updatePreviewRatio(this.value, 'filosofiPreviewBox')">
                        <option value="1:1" ${currentRatio === '1:1' ? 'selected' : ''}>1:1 (Persegi)</option>
                        <option value="3:4" ${currentRatio === '3:4' ? 'selected' : ''}>3:4 (Potret / Vertikal)</option>
                    </select>
                    <label>Insert Gambar / Logo (Format .PNG / .JPG / .WEBP)</label>
                    <input type="file" id="f_filosofiFoto" accept="image/*" onchange="handleImageSelect(this, 'filosofiImgPreview', false)">
                    
                    <label>Judul Bagian Filosofi</label>
                    <input type="text" id="f_filosofiJudul" required value="${defaultTitle}">

                    <label>Teks Penjelasan Filosofi (Bold, Miring, Underline &amp; Enter)</label>
                    <div class="editor-toolbar">
                        <button type="button" class="tool-btn" onclick="formatDoc('bold', 'f_filosofi_editor')" title="Tebal"><b>B</b> Bold</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('italic', 'f_filosofi_editor')" title="Miring"><i>I</i> Miring</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('underline', 'f_filosofi_editor')" title="Garis Bawah"><u>U</u> Underline</button>
                        <button type="button" class="tool-btn" onclick="formatDoc('insertParagraph', 'f_filosofi_editor')" title="Baris Baru">↵ Enter / Paragraf</button>
                    </div>
                    <div id="f_filosofi_editor" class="rich-editor" contenteditable="true">${defaultTeks}</div>
                `;
                return;
            }

            listCard.style.display = 'block';
            const isEdit = editingIndex !== null;
            const editItem = isEdit ? siteData[currentTab][editingIndex] : null;
            formTitle.textContent = isEdit ? 'Edit Konten' : 'Tambah Konten Baru';
            submitBtn.textContent = isEdit ? 'Simpan Perubahan ke GitHub' : 'Simpan & Publikasikan ke GitHub';
            cancelBtn.style.display = isEdit ? 'inline-block' : 'none';

            if (currentTab === 'seduhRasa' || currentTab === 'sambungCerita') {
                container.innerHTML = `
                    <label>Judul Tulisan</label>
                    <input type="text" id="f_judul" required placeholder="Masukkan judul..." value="${isEdit ? escapeHtml(editItem.judul) : ''}">
                    <label>Tanggal</label>
                    <input type="date" id="f_tanggal" value="${isEdit ? editItem.tanggal : today}" required>
                    <label>Kategori / Label</label>
                    <input type="text" id="f_kategori" required placeholder="Contoh: Refleksi, Kolaborasi" value="${isEdit ? escapeHtml(editItem.kategori) : ''}">
                    <label>Ringkasan Singkat (Tampil di daftar)</label>
                    <input type="text" id="f_ringkasan" required placeholder="1-2 kalimat pembuka..." value="${isEdit ? escapeHtml(editItem.ringkasan) : ''}">
                    <label>Isi Tulisan Lengkap</label>
                    <textarea id="f_isi" required placeholder="Tulis isi lengkap di sini...">${isEdit ? editItem.isi : ''}</textarea>
                `;
            } else if (currentTab === 'ukirKarya') {
                container.innerHTML = `
                    <label>Nama Karya / Proyek</label>
                    <input type="text" id="f_judul" required placeholder="Contoh: Sistem Informasi Layanan" value="${isEdit ? escapeHtml(editItem.judul) : ''}">
                    <label>Tanggal / Tahun</label>
                    <input type="date" id="f_tanggal" value="${isEdit ? editItem.tanggal : today}" required>
                    <label>Deskripsi Karya</label>
                    <textarea id="f_deskripsi" required placeholder="Jelaskan fungsi dan dampak karya ini...">${isEdit ? editItem.deskripsi : ''}</textarea>
                    <label>Tag Teknologi (Pisahkan dengan koma)</label>
                    <input type="text" id="f_tags" placeholder="Contoh: HTML, JavaScript, UI/UX" value="${isEdit ? escapeHtml((editItem.tags || []).join(', ')) : ''}">
                    <label>Tautan Karya / Demo</label>
                    <input type="url" id="f_link" required placeholder="https://..." value="${isEdit ? escapeHtml(editItem.link) : ''}">
                `;
            } else if (currentTab === 'pojokUnduh') {
                container.innerHTML = `
                    <label>Nama Berkas / Dokumen</label>
                    <input type="text" id="f_judul" required placeholder="Contoh: Template SOP Digital" value="${isEdit ? escapeHtml(editItem.judul) : ''}">
                    <label>Format / Ukuran Berkas</label>
                    <input type="text" id="f_ukuran" required placeholder="Contoh: PDF (1.2 MB) atau DOCX" value="${isEdit ? escapeHtml(editItem.ukuran) : ''}">
                    <label>Keterangan Berkas</label>
                    <textarea id="f_deskripsi" required placeholder="Penjelasan singkat isi dokumen...">${isEdit ? editItem.deskripsi : ''}</textarea>
                    <label>Tautan Unduhan (Google Drive / GitHub File)</label>
                    <input type="url" id="f_link" required placeholder="https://..." value="${isEdit ? escapeHtml(editItem.link) : ''}">
                `;
            } else if (currentTab === 'kontak') {
                const detected = isEdit ? detectPlatformFromLink(editItem.link) : { platform: 'whatsapp', target: '' };
                const preset = PLATFORM_PRESETS[detected.platform];
                container.innerHTML = `
                    <label>Pilih Jenis Platform / Kontak</label>
                    <select id="f_platform" onchange="onPlatformChange()">
                        <option value="whatsapp" ${detected.platform === 'whatsapp' ? 'selected' : ''}>💬 WhatsApp</option>
                        <option value="email" ${detected.platform === 'email' ? 'selected' : ''}>✉️ Email</option>
                        <option value="instagram" ${detected.platform === 'instagram' ? 'selected' : ''}>📸 Instagram</option>
                        <option value="github" ${detected.platform === 'github' ? 'selected' : ''}>💻 GitHub</option>
                        <option value="linkedin" ${detected.platform === 'linkedin' ? 'selected' : ''}>🔗 LinkedIn</option>
                        <option value="tiktok" ${detected.platform === 'tiktok' ? 'selected' : ''}>🎵 TikTok</option>
                        <option value="youtube" ${detected.platform === 'youtube' ? 'selected' : ''}>▶️ YouTube</option>
                        <option value="x" ${detected.platform === 'x' ? 'selected' : ''}>𝕏 X (Twitter)</option>
                        <option value="telegram" ${detected.platform === 'telegram' ? 'selected' : ''}>✈️ Telegram</option>
                        <option value="custom" ${detected.platform === 'custom' ? 'selected' : ''}>🌐 Tautan Website Lainnya</option>
                    </select>
                    <label>Ikon Emoji (Terisi Otomatis)</label>
                    <input type="text" id="f_ikon" required value="${isEdit ? escapeHtml(editItem.ikon) : preset.ikon}">
                    <label>Nama Tombol Tampil (Terisi Otomatis)</label>
                    <input type="text" id="f_nama" required value="${isEdit ? escapeHtml(editItem.nama) : preset.nama}">
                    <label id="lbl_target">${preset.label}</label>
                    <input type="text" id="f_target" required placeholder="${preset.placeholder}" value="${isEdit ? escapeHtml(detected.target) : ''}">
                    <div class="helper-hint" id="hint_target">${preset.hint}</div>
                `;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function startEdit(index) {
            editingIndex = index;
            renderForm();
            document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editingIndex = null;
            renderForm();
        }

        function renderList() {
            if (currentTab === 'profil' || currentTab === 'filosofi') return;
            const listEl = document.getElementById('existingList');
            const items = siteData[currentTab] || [];
            if (items.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted);">Belum ada item di kategori ini.</p>';
                return;
            }
            listEl.innerHTML = items.map((item, index) => `
                <div class="item-row">
                    <div>
                        <strong>${item.ikon ? item.ikon + ' ' : ''}${item.judul || item.nama}</strong><br>
                        <small style="color:var(--text-muted);">${item.tanggal || item.ukuran || item.link || ''}</small>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-warning" onclick="startEdit(${index})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteItem(${index})">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        async function uploadImageFile(targetFilename, commitMsg) {
            const owner = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');

            let existingSha = null;
            const checkRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${targetFilename}?t=${Date.now()}`, {
                headers: getAuthHeaders(token),
                cache: 'no-store'
            });
            if (checkRes.ok) {
                const existing = await checkRes.json();
                existingSha = existing.sha;
            }

            const bodyPayload = {
                message: commitMsg,
                content: selectedImageBase64
            };
            if (existingSha) bodyPayload.sha = existingSha;

            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${targetFilename}`, {
                method: 'PUT',
                headers: {
                    ...getAuthHeaders(token),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyPayload)
            });

            if (!putRes.ok) {
                const errData = await putRes.json().catch(() => ({}));
                throw new Error(`Gagal unggah ${targetFilename} (${putRes.status}): ${errData.message || 'Periksa izin Write pada Token GitHub.'}`);
            }
            selectedImageBase64 = null;
        }

        async function saveItem(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            try {
                if (currentTab === 'profil') {
                    if (selectedImageBase64) {
                        await uploadImageFile('profil.png', 'Memperbarui foto profil (profil.png) via Admin Panel');
                        siteData.profil.fotoVersion = Date.now();
                    }
                    siteData.profil.fotoRatio = document.getElementById('f_fotoRatio').value;
                    siteData.profil.tentang = document.getElementById('f_tentang_editor').innerHTML.trim();
                    siteData.profil.footer = document.getElementById('f_footer').value;
                    await pushToGitHub('Memperbarui foto, profil & footer');
                    renderForm();
                    return;
                }

                if (currentTab === 'filosofi') {
                    if (selectedImageBase64) {
                        await uploadImageFile('logo-filosofi.png', 'Memperbarui logo filosofi (logo-filosofi.png) via Admin Panel');
                        siteData.filosofi.fotoVersion = Date.now();
                    }
                    siteData.filosofi.fotoRatio = document.getElementById('f_filosofiRatio').value;
                    siteData.filosofi.judul = document.getElementById('f_filosofiJudul').value.trim();
                    siteData.filosofi.teks = document.getElementById('f_filosofi_editor').innerHTML.trim();
                    await pushToGitHub('Memperbarui frame filosofi logo via Admin Panel');
                    renderForm();
                    return;
                }

                const isEdit = editingIndex !== null;
                const itemData = { id: isEdit ? siteData[currentTab][editingIndex].id : Date.now() };

                if (currentTab === 'seduhRasa' || currentTab === 'sambungCerita') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.tanggal = document.getElementById('f_tanggal').value;
                    itemData.kategori = document.getElementById('f_kategori').value;
                    itemData.ringkasan = document.getElementById('f_ringkasan').value;
                    itemData.isi = document.getElementById('f_isi').value;
                } else if (currentTab === 'ukirKarya') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.tanggal = document.getElementById('f_tanggal').value;
                    itemData.deskripsi = document.getElementById('f_deskripsi').value;
                    itemData.tags = document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(Boolean);
                    itemData.link = document.getElementById('f_link').value;
                } else if (currentTab === 'pojokUnduh') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.ukuran = document.getElementById('f_ukuran').value;
                    itemData.deskripsi = document.getElementById('f_deskripsi').value;
                    itemData.link = document.getElementById('f_link').value;
                } else if (currentTab === 'kontak') {
                    const platform = document.getElementById('f_platform').value;
                    const targetVal = document.getElementById('f_target').value;
                    itemData.ikon = document.getElementById('f_ikon').value.trim();
                    itemData.nama = document.getElementById('f_nama').value.trim();
                    itemData.link = buildContactUrl(platform, targetVal);
                }

                if (isEdit) {
                    siteData[currentTab][editingIndex] = itemData;
                    editingIndex = null;
                    await pushToGitHub('Mengedit konten via Admin Panel');
                } else {
                    if (currentTab === 'kontak') {
                        siteData[currentTab].push(itemData);
                    } else {
                        siteData[currentTab].unshift(itemData);
                    }
                    await pushToGitHub('Menambah konten baru via Admin Panel');
                }

                document.getElementById('contentForm').reset();
                renderForm();
            } catch (err) {
                showStatus(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = editingIndex !== null ? 'Simpan Perubahan ke GitHub' : 'Simpan & Publikasikan ke GitHub';
            }
        }

        async function deleteItem(index) {
            if (!confirm('Yakin ingin menghapus item ini?')) return;
            if (editingIndex === index) editingIndex = null;
            siteData[currentTab].splice(index, 1);
            await pushToGitHub('Menghapus konten via Admin Panel');
            renderForm();
        }

        async function pushToGitHub(commitMessage) {
            const owner = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');

            const latestRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json?t=${Date.now()}`, {
                headers: getAuthHeaders(token),
                cache: 'no-store'
            });
            if (latestRes.ok) {
                const latestData = await latestRes.json();
                fileSha = latestData.sha;
            }

            const jsonString = JSON.stringify(siteData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
                method: 'PUT',
                headers: {
                    ...getAuthHeaders(token),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: encodedContent,
                    sha: fileSha
                })
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(`Gagal menyimpan data.json (${res.status}): ${errData.message || 'Periksa izin Write pada Token GitHub.'}`);
            }

            const result = await res.json();
            fileSha = result.content.sha;
            renderList();
            showStatus('Berhasil disimpan! Perubahan akan tampil di web dalam ±1 menit.');
        }
    </script>
</body>
