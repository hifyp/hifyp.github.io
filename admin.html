<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Hifyp</title>
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --bg-header: #0f172a;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="dark"] {
            --bg-body: #090d16; --bg-card: #131b2e; --bg-header: #060910;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --border-color: #1e293b;
            --accent: #60a5fa; --accent-hover: #3b82f6; --danger: #f87171; --warning: #fbbf24;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        header { background: var(--bg-header); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.3rem; }
        .container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--bg-card); padding: 28px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="date"], input[type="url"], input[type="file"], select, textarea { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); font-family: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 0.9rem; color: var(--text-muted); }
        .checkbox-row input { width: auto; margin: 0; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn:hover { background: var(--accent-hover); }
        .btn-edit { background: var(--warning); color: #0f172a; padding: 6px 12px; font-size: 0.8rem; }
        .btn-danger { background: var(--danger); padding: 6px 12px; font-size: 0.8rem; }
        .btn-cancel { background: #64748b; margin-left: 8px; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); gap: 12px; }
        .item-row:last-child { border-bottom: none; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .status-msg { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; font-weight: 500; }
        .status-ok { background: #dcfce7; color: #166534; display: block; }
        .status-err { background: #fee2e2; color: #991b1b; display: block; }
        .preview-box { width: 130px; height: 130px; border-radius: 12px; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 16px; background: var(--bg-body); }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .hint-text { display: block; font-size: 0.82rem; color: var(--accent); margin-top: -12px; margin-bottom: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>🔐 Admin Panel - Hifyp</h1>
        <div>
            <a href="index.html" class="btn btn-outline" style="text-decoration:none; margin-right:8px;">Lihat Web</a>
            <button id="logoutBtn" class="btn btn-outline" style="display:none;" onclick="logout()">Keluar</button>
        </div>
    </header>

    <div class="container">
        <div id="statusBox" class="status-msg"></div>

        <!-- FORM LOGIN -->
        <div id="loginSection" class="card">
            <h2 style="margin-top:0;">Masuk Pengelola Konten</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Gunakan GitHub Personal Access Token (PAT) dengan izin <b>Contents: Read and write</b>.</p>
            
            <label>Username GitHub</label>
            <input type="text" id="ghOwner" value="hifyp">

            <label>Nama Repository</label>
            <input type="text" id="ghRepo" value="hifyp.github.io">

            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="github_pat_xxxx atau ghp_xxxx">

            <div class="checkbox-row">
                <input type="checkbox" id="rememberToken" checked>
                <label for="rememberToken" style="margin:0; font-weight:400; cursor:pointer;">Ingat login di perangkat ini (tidak perlu input token lagi)</label>
            </div>

            <button class="btn" onclick="login()">Masuk Dashboard</button>
        </div>

        <!-- DASHBOARD ADMIN -->
        <div id="dashboardSection" style="display:none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('profil', this)">Profil, Foto & Footer</button>
                <button class="tab-btn" onclick="switchTab('seduhRasa', this)">Seduh Rasa</button>
                <button class="tab-btn" onclick="switchTab('sambungCerita', this)">Sambung Cerita</button>
                <button class="tab-btn" onclick="switchTab('ukirKarya', this)">Ukir Karya</button>
                <button class="tab-btn" onclick="switchTab('pojokUnduh', this)">Pojok Unduh</button>
                <button class="tab-btn" onclick="switchTab('kontak', this)">Kontak & Medsos</button>
            </div>

            <!-- Form Utama -->
            <div class="card" id="formCard">
                <h3 id="formTitle" style="margin-top:0;">Pengaturan Profil, Foto & Footer</h3>
                <form id="contentForm" onsubmit="saveNewItem(event)">
                    <div id="dynamicFields"></div>
                    <button type="submit" class="btn" id="submitBtn">Simpan & Publikasikan ke GitHub</button>
                    <button type="button" class="btn btn-cancel" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Batal Edit</button>
                </form>
            </div>

            <!-- Daftar Konten Tersimpan -->
            <div class="card" id="listCard" style="display:none;">
                <h3 style="margin-top:0;">Daftar Konten Aktif</h3>
                <div id="existingList">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        let currentTab = 'profil';
        let siteData = { profil: {}, seduhRasa: [], sambungCerita: [], ukirKarya: [], pojokUnduh: [], kontak: [] };
        let fileSha = '';
        let selectedPngBase64 = null;
        let editingIndex = null;

        const CONTACT_PRESETS = {
            whatsapp: { ikon: '💬', nama: 'WhatsApp', label: 'Nomor WhatsApp', placeholder: 'Contoh: 08896565758 atau 628896565758' },
            email:    { ikon: '✉️', nama: 'Email', label: 'Alamat Email', placeholder: 'Contoh: nama@gmail.com' },
            instagram:{ ikon: '📸', nama: 'Instagram', label: 'Username atau Link Instagram', placeholder: 'Contoh: hifyp atau https://instagram.com/hifyp' },
            github:   { ikon: '💻', nama: 'GitHub', label: 'Username atau Link GitHub', placeholder: 'Contoh: hifyp atau https://github.com/hifyp' },
            linkedin: { ikon: '🔗', nama: 'LinkedIn', label: 'Username atau Link LinkedIn', placeholder: 'Contoh: hifyp atau https://linkedin.com/in/hifyp' },
            tiktok:   { ikon: '🎵', nama: 'TikTok', label: 'Username atau Link TikTok', placeholder: 'Contoh: @hifyp atau https://tiktok.com/@hifyp' },
            youtube:  { ikon: '▶️', nama: 'YouTube', label: 'Handle atau Link YouTube', placeholder: 'Contoh: @hifyp atau https://youtube.com/@hifyp' },
            twitter:  { ikon: '🐦', nama: 'X / Twitter', label: 'Username atau Link X', placeholder: 'Contoh: hifyp atau https://x.com/hifyp' },
            telegram: { ikon: '✈️', nama: 'Telegram', label: 'Username atau Link Telegram', placeholder: 'Contoh: hifyp atau https://t.me/hifyp' },
            custom:   { ikon: '🌐', nama: 'Website / Lainnya', label: 'Tautan URL Lengkap', placeholder: 'Contoh: https://...' }
        };

        window.onload = () => {
            const savedToken = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');
            if (savedToken) {
                document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner') || 'hifyp';
                document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo') || 'hifyp.github.io';
                document.getElementById('ghToken').value = savedToken;
                login(true);
            }
        };

        function showStatus(msg, isError = false) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status-msg ' + (isError ? 'status-err' : 'status-ok');
            if (!isError) {
                setTimeout(() => { box.style.display = 'none'; }, 6000);
            }
        }

        function getAuthHeaders(token) {
            return {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
        }

        async function login(isAuto = false) {
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const remember = document.getElementById('rememberToken').checked;

            if (!owner || !repo || !token) return showStatus('Semua kolom wajib diisi!', true);

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json?ref=main&t=${Date.now()}`, {
                    headers: getAuthHeaders(token),
                    cache: 'no-store'
                });

                if (!res.ok) {
                    const errJson = await res.json().catch(() => ({}));
                    throw new Error(`Gagal akses GitHub (${res.status}): ${errJson.message || 'Token tidak valid atau data.json belum ada.'}`);
                }

                const json = await res.json();
                fileSha = json.sha;
                const cleanBase64 = json.content.replace(/\n/g, '');
                const decoded = decodeURIComponent(escape(atob(cleanBase64)));
                siteData = JSON.parse(decoded);
                if (!siteData.kontak) siteData.kontak = [];
                if (!siteData.profil) siteData.profil = {};

                const storage = remember ? localStorage : sessionStorage;
                storage.setItem('gh_owner', owner);
                storage.setItem('gh_repo', repo);
                storage.setItem('gh_token', token);

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                if (!isAuto) showStatus('Berhasil terhubung ke repository GitHub!');
                
                renderForm();
                renderList();
            } catch (err) {
                if (isAuto) {
                    localStorage.removeItem('gh_token');
                    sessionStorage.removeItem('gh_token');
                }
                showStatus(err.message, true);
            }
        }

        function logout() {
            localStorage.removeItem('gh_owner');
            localStorage.removeItem('gh_repo');
            localStorage.removeItem('gh_token');
            sessionStorage.clear();
            location.reload();
        }

        function switchTab(tabName, btnEl) {
            currentTab = tabName;
            selectedPngBase64 = null;
            editingIndex = null;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderForm();
            renderList();
        }

        function onPlatformChange(type, isEditingInit = false) {
            const preset = CONTACT_PRESETS[type] || CONTACT_PRESETS.custom;
            if (!isEditingInit) {
                document.getElementById('f_ikon').value = preset.ikon;
                document.getElementById('f_nama').value = preset.nama;
            }
            document.getElementById('f_link_label').textContent = preset.label;
            document.getElementById('f_link').placeholder = preset.placeholder;
            updateLinkPreview();
        }

        function buildFormattedContactLink(type, rawVal) {
            const val = rawVal.trim();
            if (!val) return '';

            if (type === 'whatsapp') {
                if (val.startsWith('http://') || val.startsWith('https://')) return val;
                let digits = val.replace(/\D/g, '');
                if (digits.startsWith('0')) digits = '62' + digits.slice(1);
                return `https://wa.me/${digits}`;
            }
            if (type === 'email') {
                if (val.startsWith('mailto:')) return val;
                return `mailto:${val}`;
            }
            if (val.startsWith('http://') || val.startsWith('https://')) {
                return val;
            }
            const cleanUser = val.replace(/^@/, '');
            if (type === 'instagram') return `https://instagram.com/${cleanUser}`;
            if (type === 'github') return `https://github.com/${cleanUser}`;
            if (type === 'linkedin') return `https://linkedin.com/in/${cleanUser}`;
            if (type === 'tiktok') return `https://tiktok.com/@${cleanUser}`;
            if (type === 'youtube') return `https://youtube.com/@${cleanUser}`;
            if (type === 'twitter') return `https://x.com/${cleanUser}`;
            if (type === 'telegram') return `https://t.me/${cleanUser}`;
            return `https://${val}`;
        }

        function updateLinkPreview() {
            const typeEl = document.getElementById('f_platform');
            const inputEl = document.getElementById('f_link');
            const hintEl = document.getElementById('f_link_preview');
            if (!typeEl || !inputEl || !hintEl) return;

            const raw = inputEl.value.trim();
            if (!raw) {
                hintEl.textContent = 'Otomatis menambahkan format link (wa.me / mailto: / https://)';
                return;
            }
            hintEl.textContent = 'Hasil tautan otomatis: ' + buildFormattedContactLink(typeEl.value, raw);
        }

        function detectPlatformFromLink(link, nama = '') {
            const l = (link || '').toLowerCase();
            const n = (nama || '').toLowerCase();
            if (l.includes('wa.me') || l.includes('whatsapp') || n.includes('wa') || n.includes('whatsapp')) return 'whatsapp';
            if (l.startsWith('mailto:') || n.includes('email') || n.includes('mail')) return 'email';
            if (l.includes('instagram.com') || n.includes('instagram')) return 'instagram';
            if (l.includes('github.com') || n.includes('github')) return 'github';
            if (l.includes('linkedin.com') || n.includes('linkedin')) return 'linkedin';
            if (l.includes('tiktok.com') || n.includes('tiktok')) return 'tiktok';
            if (l.includes('youtube.com') || l.includes('youtu.be') || n.includes('youtube')) return 'youtube';
            if (l.includes('twitter.com') || l.includes('x.com') || n.includes('twitter')) return 'twitter';
            if (l.includes('t.me') || l.includes('telegram') || n.includes('telegram')) return 'telegram';
            return 'custom';
        }

        function editItem(index) {
            editingIndex = index;
            const item = siteData[currentTab][index];
            renderForm();

            if (currentTab === 'seduhRasa' || currentTab === 'sambungCerita') {
                document.getElementById('f_judul').value = item.judul || '';
                document.getElementById('f_tanggal').value = item.tanggal || '';
                document.getElementById('f_kategori').value = item.kategori || '';
                document.getElementById('f_ringkasan').value = item.ringkasan || '';
                document.getElementById('f_isi').value = item.isi || '';
            } else if (currentTab === 'ukirKarya') {
                document.getElementById('f_judul').value = item.judul || '';
                document.getElementById('f_tanggal').value = item.tanggal || '';
                document.getElementById('f_deskripsi').value = item.deskripsi || '';
                document.getElementById('f_tags').value = (item.tags || []).join(', ');
                document.getElementById('f_link').value = item.link || '';
            } else if (currentTab === 'pojokUnduh') {
                document.getElementById('f_judul').value = item.judul || '';
                document.getElementById('f_ukuran').value = item.ukuran || '';
                document.getElementById('f_deskripsi').value = item.deskripsi || '';
                document.getElementById('f_link').value = item.link || '';
            } else if (currentTab === 'kontak') {
                const detected = detectPlatformFromLink(item.link, item.nama);
                document.getElementById('f_platform').value = detected;
                onPlatformChange(detected, true);
                document.getElementById('f_ikon').value = item.ikon || '';
                document.getElementById('f_nama').value = item.nama || '';

                let displayVal = item.link || '';
                if (detected === 'whatsapp') displayVal = displayVal.replace(/^https?:\/\/wa\.me\//i, '');
                if (detected === 'email') displayVal = displayVal.replace(/^mailto:/i, '');
                document.getElementById('f_link').value = displayVal;
                updateLinkPreview();
            }

            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editingIndex = null;
            renderForm();
        }

        function handlePngSelect(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.type !== 'image/png') {
                showStatus('Harap pilih file gambar dengan format .PNG!', true);
                input.value = '';
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showStatus('Ukuran foto maksimal 2 MB agar halaman cepat dimuat.', true);
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const preview = document.getElementById('imgPreview');
                preview.src = dataUrl;
                preview.style.display = 'block';
                selectedPngBase64 = dataUrl.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        function renderForm() {
            const container = document.getElementById('dynamicFields');
            const listCard = document.getElementById('listCard');
            const formTitle = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');
            const today = new Date().toISOString().split('T')[0];

            if (currentTab === 'profil') {
                formTitle.textContent = 'Pengaturan Foto Profil (.PNG), Tentang Saya & Footer';
                listCard.style.display = 'none';
                cancelBtn.style.display = 'none';
                submitBtn.textContent = 'Simpan & Publikasikan ke GitHub';
                const defaultAbout = siteData.profil.tentang || 'Sebagai Penata Kelola Sistem dan Teknologi Informasi lulusan S1 Sistem Informasi di Dinas Pendidikan Provinsi DKI Jakarta, saya menjembatani tata kelola organisasi dengan solusi teknologi praktis. Berlandaskan semangat "Berkembang dengan Ilmu, Berdampak melalui Karya" serta "Bergerak dalam senyap, berdampak dalam nyata", saya membangun alur kerja digital yang ringan, efisien, dan berdampak.';
                const defaultFooter = siteData.profil.footer || '© 2026. hifyp by GitHub.';
                const v = siteData.profil.fotoVersion || Date.now();

                container.innerHTML = `
                    <label>Pratinjau Foto Saat Ini</label>
                    <div class="preview-box">
                        <img id="imgPreview" src="profil.png?v=${v}" onerror="this.style.display='none'" alt="Pratinjau">
                    </div>
                    <label>Unggah Foto Baru (Wajib Format .PNG)</label>
                    <input type="file" id="f_foto" accept="image/png" onchange="handlePngSelect(this)">
                    <label>Teks Bagian "Tentang Saya"</label>
                    <textarea id="f_tentang" required>${defaultAbout}</textarea>
                    <label>Teks Footer (Bagian Paling Bawah Halaman)</label>
                    <input type="text" id="f_footer" required value="${defaultFooter}">
                `;
                return;
            }

            const isEditing = editingIndex !== null;
            formTitle.textContent = isEditing ? '✏️ Edit Konten' : 'Tambah Konten Baru';
            submitBtn.textContent = isEditing ? 'Simpan Perubahan ke GitHub' : 'Simpan & Publikasikan ke GitHub';
            cancelBtn.style.display = isEditing ? 'inline-block' : 'none';
            listCard.style.display = 'block';

            if (currentTab === 'seduhRasa' || currentTab === 'sambungCerita') {
                container.innerHTML = `
                    <label>Judul Tulisan</label>
                    <input type="text" id="f_judul" required placeholder="Masukkan judul...">
                    <label>Tanggal</label>
                    <input type="date" id="f_tanggal" value="${today}" required>
                    <label>Kategori / Label</label>
                    <input type="text" id="f_kategori" required placeholder="Contoh: Refleksi, Kolaborasi">
                    <label>Ringkasan Singkat (Tampil di daftar)</label>
                    <input type="text" id="f_ringkasan" required placeholder="1-2 kalimat pembuka...">
                    <label>Isi Tulisan Lengkap</label>
                    <textarea id="f_isi" required placeholder="Tulis isi lengkap di sini..."></textarea>
                `;
            } else if (currentTab === 'ukirKarya') {
                container.innerHTML = `
                    <label>Nama Karya / Proyek</label>
                    <input type="text" id="f_judul" required placeholder="Contoh: Sistem Informasi Layanan">
                    <label>Tanggal / Tahun</label>
                    <input type="date" id="f_tanggal" value="${today}" required>
                    <label>Deskripsi Karya</label>
                    <textarea id="f_deskripsi" required placeholder="Jelaskan fungsi dan dampak karya ini..."></textarea>
                    <label>Tag Teknologi (Pisahkan dengan koma)</label>
                    <input type="text" id="f_tags" placeholder="Contoh: HTML, JavaScript, UI/UX">
                    <label>Tautan Karya / Demo</label>
                    <input type="url" id="f_link" required placeholder="https://...">
                `;
            } else if (currentTab === 'pojokUnduh') {
                container.innerHTML = `
                    <label>Nama Berkas / Dokumen</label>
                    <input type="text" id="f_judul" required placeholder="Contoh: Template SOP Digital">
                    <label>Format / Ukuran Berkas</label>
                    <input type="text" id="f_ukuran" required placeholder="Contoh: PDF (1.2 MB) atau DOCX">
                    <label>Keterangan Berkas</label>
                    <textarea id="f_deskripsi" required placeholder="Penjelasan singkat isi dokumen..."></textarea>
                    <label>Tautan Unduhan (Google Drive / GitHub File)</label>
                    <input type="url" id="f_link" required placeholder="https://...">
                `;
            } else if (currentTab === 'kontak') {
                container.innerHTML = `
                    <label>Pilih Jenis Kontak / Sosial Media</label>
                    <select id="f_platform" onchange="onPlatformChange(this.value)">
                        <option value="whatsapp">💬 WhatsApp (Otomatis wa.me)</option>
                        <option value="email">✉️ Email (Otomatis mailto:)</option>
                        <option value="instagram">📸 Instagram</option>
                        <option value="github">💻 GitHub</option>
                        <option value="linkedin">🔗 LinkedIn</option>
                        <option value="tiktok">🎵 TikTok</option>
                        <option value="youtube">▶️ YouTube</option>
                        <option value="twitter">🐦 X / Twitter</option>
                        <option value="telegram">✈️ Telegram</option>
                        <option value="custom">🌐 Website / Tautan Lainnya</option>
                    </select>

                    <label id="f_link_label">Nomor WhatsApp</label>
                    <input type="text" id="f_link" required placeholder="Contoh: 08896565758 atau 628896565758" oninput="updateLinkPreview()">
                    <small class="hint-text" id="f_link_preview">Otomatis menambahkan format link (wa.me / mailto: / https://)</small>

                    <label>Nama Tombol (Otomatis, bisa diubah)</label>
                    <input type="text" id="f_nama" required value="WhatsApp">

                    <label>Ikon Emoji (Otomatis, bisa diubah)</label>
                    <input type="text" id="f_ikon" required value="💬">
                `;
            }
        }

        function renderList() {
            if (currentTab === 'profil') return;
            const listEl = document.getElementById('existingList');
            const items = siteData[currentTab] || [];
            if (items.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted);">Belum ada item di kategori ini.</p>';
                return;
            }
            listEl.innerHTML = items.map((item, index) => `
                <div class="item-row">
                    <div>
                        <strong>${item.ikon ? item.ikon + ' ' : ''}${item.judul || item.nama}</strong><br>
                        <small style="color:var(--text-muted);">${item.tanggal || item.ukuran || item.link || ''}</small>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-edit" onclick="editItem(${index})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteItem(${index})">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        async function uploadPngFile() {
            const owner = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');

            let existingPhotoSha = null;
            const checkRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/profil.png?t=${Date.now()}`, {
                headers: getAuthHeaders(token),
                cache: 'no-store'
            });
            if (checkRes.ok) {
                const existing = await checkRes.json();
                existingPhotoSha = existing.sha;
            }

            const bodyPayload = {
                message: 'Memperbarui foto profil (profil.png) via Admin Panel',
                content: selectedPngBase64
            };
            if (existingPhotoSha) bodyPayload.sha = existingPhotoSha;

            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/profil.png`, {
                method: 'PUT',
                headers: {
                    ...getAuthHeaders(token),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyPayload)
            });

            if (!putRes.ok) {
                const errData = await putRes.json().catch(() => ({}));
                throw new Error(`Gagal unggah profil.png (${putRes.status}): ${errData.message || 'Periksa izin Write pada Token GitHub Anda.'}`);
            }
            selectedPngBase64 = null;
        }

        async function saveNewItem(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            try {
                if (currentTab === 'profil') {
                    if (selectedPngBase64) {
                        await uploadPngFile();
                        siteData.profil.fotoVersion = Date.now();
                    }
                    siteData.profil.tentang = document.getElementById('f_tentang').value;
                    siteData.profil.footer = document.getElementById('f_footer').value;
                    await pushToGitHub('Memperbarui foto, profil & footer');
                    renderForm();
                    return;
                }

                const isEditing = editingIndex !== null;
                const itemData = {
                    id: isEditing ? siteData[currentTab][editingIndex].id : Date.now()
                };

                if (currentTab === 'seduhRasa' || currentTab === 'sambungCerita') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.tanggal = document.getElementById('f_tanggal').value;
                    itemData.kategori = document.getElementById('f_kategori').value;
                    itemData.ringkasan = document.getElementById('f_ringkasan').value;
                    itemData.isi = document.getElementById('f_isi').value;
                } else if (currentTab === 'ukirKarya') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.tanggal = document.getElementById('f_tanggal').value;
                    itemData.deskripsi = document.getElementById('f_deskripsi').value;
                    itemData.tags = document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(Boolean);
                    itemData.link = document.getElementById('f_link').value;
                } else if (currentTab === 'pojokUnduh') {
                    itemData.judul = document.getElementById('f_judul').value;
                    itemData.ukuran = document.getElementById('f_ukuran').value;
                    itemData.deskripsi = document.getElementById('f_deskripsi').value;
                    itemData.link = document.getElementById('f_link').value;
                } else if (currentTab === 'kontak') {
                    const platformType = document.getElementById('f_platform').value;
                    const rawInput = document.getElementById('f_link').value;
                    itemData.ikon = document.getElementById('f_ikon').value.trim();
                    itemData.nama = document.getElementById('f_nama').value.trim();
                    itemData.link = buildFormattedContactLink(platformType, rawInput);
                }

                if (isEditing) {
                    siteData[currentTab][editingIndex] = itemData;
                    await pushToGitHub('Mengedit konten via Admin Panel');
                    editingIndex = null;
                } else {
                    if (currentTab === 'kontak') {
                        siteData[currentTab].push(itemData);
                    } else {
                        siteData[currentTab].unshift(itemData);
                    }
                    await pushToGitHub('Menambah konten via Admin Panel');
                }

                document.getElementById('contentForm').reset();
                renderForm();
            } catch (err) {
                showStatus(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = editingIndex !== null ? 'Simpan Perubahan ke GitHub' : 'Simpan & Publikasikan ke GitHub';
            }
        }

        async function deleteItem(index) {
            if (!confirm('Yakin ingin menghapus item ini?')) return;
            if (editingIndex === index) editingIndex = null;
            siteData[currentTab].splice(index, 1);
            await pushToGitHub('Menghapus konten via Admin Panel');
            renderForm();
        }

        async function pushToGitHub(commitMessage) {
            const owner = localStorage.getItem('gh_owner') || sessionStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo') || sessionStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token');

            const latestRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json?t=${Date.now()}`, {
                headers: getAuthHeaders(token),
                cache: 'no-store'
            });
            if (latestRes.ok) {
                const latestData = await latestRes.json();
                fileSha = latestData.sha;
            }

            const jsonString = JSON.stringify(siteData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
                method: 'PUT',
                headers: {
                    ...getAuthHeaders(token),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: encodedContent,
                    sha: fileSha
                })
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(`Gagal menyimpan data.json (${res.status}): ${errData.message || 'Periksa izin Write pada Token GitHub.'}`);
            }

            const result = await res.json();
            fileSha = result.content.sha;
            renderList();
            showStatus('Berhasil disimpan! Perubahan akan tampil di web dalam ±1 menit.');
        }
    </script>
</body>
