<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sambung Cerita - Hifyp</title>
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --bg-header: #0f172a;
            --text-main: #1e293b; --text-muted: #64748b; --text-header: #f8fafc;
            --text-header-sub: #94a3b8; --border-color: #e2e8f0;
            --accent: #3b82f6; --accent-hover: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] {
            --bg-body: #090d16; --bg-card: #131b2e; --bg-header: #060910;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-header: #f8fafc;
            --text-header-sub: #64748b; --border-color: #1e293b;
            --accent: #60a5fa; --accent-hover: #3b82f6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        header { background: var(--bg-header); color: var(--text-header); padding: 70px 20px 55px; text-align: center; position: relative; border-bottom: 1px solid var(--border-color); }
        .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: 20px; text-decoration: none; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .theme-toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }
        
        header h1 { margin: 0; font-size: 2.2rem; }
        header p { color: var(--text-header-sub); margin-top: 8px; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .article-card { background: var(--bg-card); padding: 28px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow); margin-bottom: 24px; }
        .meta { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
        .article-card h2 { margin: 0 0 12px 0; font-size: 1.4rem; }
        .article-card p { color: var(--text-muted); margin-bottom: 18px; text-align: justify; }
        .btn { display: inline-block; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn:hover { background: var(--accent-hover); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--bg-card); max-width: 680px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .full-text { white-space: pre-line; color: var(--text-main); margin-top: 16px; text-align: justify; }
        footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">&larr; Beranda</a>
        <button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span> <span id="themeText">Mode Gelap</span></button>
        <h1>🤝 Sambung Cerita</h1>
        <p>Wadah berbagi gagasan, catatan perjalanan, serta pengalaman kolaborasi.</p>
    </header>

    <div class="container" id="contentList">
        <p style="text-align:center;">Memuat cerita...</p>
    </div>

    <div class="modal" id="readModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="meta" id="modalMeta"></div>
            <h2 id="modalTitle" style="margin-top:0;"></h2>
            <div class="full-text" id="modalBody"></div>
        </div>
    </div>

    <footer id="footerText">&copy; 2026. hifyp by GitHub.</footer>

    <script>
        const htmlEl = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);
        document.getElementById('themeToggle').addEventListener('click', () => setTheme(htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));
        function setTheme(t) {
            htmlEl.setAttribute('data-theme', t); localStorage.setItem('theme', t);
            document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').textContent = t === 'dark' ? 'Mode Terang' : 'Mode Gelap';
        }

        let articles = [];
        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.profil && data.profil.footer) {
                    document.getElementById('footerText').textContent = data.profil.footer;
                }
                articles = data.sambungCerita || [];
                const container = document.getElementById('contentList');
                if (articles.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">Belum ada cerita yang dibagikan.</p>';
                    return;
                }
                container.innerHTML = articles.map((item, idx) => `
                    <div class="article-card">
                        <div class="meta">${item.tanggal} &bull; ${item.kategori}</div>
                        <h2>${item.judul}</h2>
                        <p>${item.ringkasan}</p>
                        <button class="btn" onclick="openModal(${idx})">Simak Cerita</button>
                    </div>
                `).join('');
            });

        function openModal(idx) {
            const item = articles[idx];
            document.getElementById('modalMeta').textContent = `${item.tanggal} • ${item.kategori}`;
            document.getElementById('modalTitle').textContent = item.judul;
            document.getElementById('modalBody').textContent = item.isi;
            document.getElementById('readModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('readModal').style.display = 'none'; }
    </script>
</body>
</html>
